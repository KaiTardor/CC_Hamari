name: Tests

on:
  push:
    branches: [ main, Test ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verificar formato con ruff
      run: |
        pip install ruff
        ruff check backend/ --select I --fix
        ruff format backend/ --check
      continue-on-error: true
    
    - name: Ejecutar tests con pytest
      env:
        MONGO_URI: mongodb://localhost:27017/HamariDB_test
        JWT_SECRET: test-secret-key-for-ci
      run: |
        python -m pytest backend/tests/ -v --tb=short
    
    - name: Generar reporte de cobertura
      if: matrix.python-version == '3.11'
      env:
        MONGO_URI: mongodb://localhost:27017/HamariDB_test
        JWT_SECRET: test-secret-key-for-ci
      run: |
        pip install pytest-cov
        python -m pytest backend/tests/ --cov=backend --cov-report=xml --cov-report=term
    
    - name: Subir cobertura a Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
