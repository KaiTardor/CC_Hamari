server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Normaliza rutas con /api duplicado (ej. /api/api/providers -> /api/providers)
    rewrite ^/api/(?:api/)+(.*)$ /api/$1 break;

    proxy_pass http://back:5000;

    proxy_http_version 1.1;

    # Conserva host:puerto reales del cliente (localhost:8080)
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Reescribe cualquier Location absoluto que venga del back con "localhost"
    proxy_redirect ~^http://localhost/(.*)$ $scheme://$http_host/$1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
