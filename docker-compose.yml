services:
  mongodb:
    image: mongo:7
    container_name: hamari-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  back:
    image: ghcr.io/kaitardor/cc-hamari-backend:latest
    container_name: hamari-backend
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongodb:27017/HamariDB
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs

  front:
    image: ghcr.io/kaitardor/cc-hamari-frontend:latest
    container_name: hamari-frontend
    restart: unless-stopped
    depends_on:
      - back
    ports:
      - "8081:80"

volumes:
  mongo_data:
