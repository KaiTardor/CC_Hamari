[pytest]
minversion = 8.0
addopts = -ra -q --cov=backend --cov-report=term-missing
testpaths = backend/tests
env_files = .env.test
filterwarnings =
	ignore:.*wait_container_is_ready.*:DeprecationWarning:testcontainers.core.waiting_utils
	ignore:.*wait_for_logs.*:DeprecationWarning:testcontainers.mongodb